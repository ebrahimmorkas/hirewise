{% extends "base.html" %}

{% block title %}Company profile{% endblock %}

{% block content %}
<div class="page-header"><h1>{% if object %}Edit company profile{% else %}Create your company profile{% endif %}</h1></div>
<div class="card">
  <form method="post" enctype="multipart/form-data" class="form" novalidate>
    {% csrf_token %}
    {{ form.as_div }}
    <div><button class="btn" type="submit">Save</button></div>
  </form>
</div>
{% endblock %}
